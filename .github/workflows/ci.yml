name: examples CI

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'

  pull_request:
    branches:
      - main

defaults:
  run:
    shell: pwsh

jobs:
  windows-VC:
    runs-on: windows-latest

    steps:
      - name: deploy sources
        uses: actions/checkout@v6
        with:
          path: examples

      - name: build/install examples from headers
        run: |
             cd examples
             mkdir -p build/headers
             mkdir -p install/headers
             cmake -DCMAKE_INSTALL_PREFIX="$pwd/install/headers" `
                   -B ./build/headers -A x64 -T host=x64 .
             cmake --build ./build/headers -j `
                   --config RelWithDebInfo `
                   --target install

      - name: build/install examples from modules
        run: |
             cd examples
             mkdir -p build/modules
             mkdir -p install/modules
             cmake -DCMAKE_INSTALL_PREFIX="$pwd/install/modules" `
                   -DUSE_CXX_MODULES=ON `
                   -B ./build/modules -A x64 -T host=x64 .
             cmake --build ./build/modules -j `
                   --config RelWithDebInfo `
                   --target install

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: WindowsVC
          path: ./examples/install/

  windows-clang:
    runs-on: windows-latest

    steps:
      - name: deploy sources
        uses: actions/checkout@v6
        with:
          path: examples

      - name: build/install examples from headers
        id: build_headers
        continue-on-error: true
        run: |
             $ErrorActionPreference = 'Continue'
             cd examples
             mkdir -p build/headers
             mkdir -p install/headers
             cmake -DCMAKE_INSTALL_PREFIX="$pwd/install/headers" `
                   -B ./build/headers -A x64 -T ClangCL .
             cmake --build ./build/headers -j `
                   --config RelWithDebInfo `
                   --target install | Tee-Object -Variable cmake_log

             if($LASTEXITCODE)
             {
               $pattern = 'clang-cl : message : diagnostic msg: (.*) \['
               $paths = ($cmake_log | sls -AllMatches -Pattern $pattern).Matches.Groups |
                   ? { $_.GetType().Name -eq 'Group' } | select -ExpandProperty Value 
               $paths = $paths -join "`r"
               "reports_paths=$paths" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append -Encoding OEM

               Get-Content $Env:GITHUB_OUTPUT
               exit 1
             }

      - name: build/install examples from modules
        id: build_modules
        if: false # cl-clang cannot yet handle cl C++20 module options
        continue-on-error: true
        run: |
             $ErrorActionPreference = 'Continue'
             cd examples
             mkdir -p build/modules
             mkdir -p install/modules
             cmake -DCMAKE_INSTALL_PREFIX="$pwd/install/modules" `
                   -DUSE_CXX_MODULES=ON `
                   -B ./build/modules -A x64 -T ClangCL .
             cmake --build ./build/modules -j `
                   --config RelWithDebInfo `
                   --target install | Tee-Object -Variable cmake_log

             if($LASTEXITCODE)
             {
               $pattern = 'clang-cl : message : diagnostic msg: (.*) \['
               $paths = ($cmake_log | sls -AllMatches -Pattern $pattern).Matches.Groups |
                   ? { $_.GetType().Name -eq 'Group' } | select -ExpandProperty Value 
               $paths = $paths -join "`r"
               "reports_paths=$paths" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append -Encoding OEM

               Get-Content $Env:GITHUB_OUTPUT
               exit 1
             }

      - name: Upload error info artifact on compiler failure
        if: ${{ steps.build_headers.outcome == 'failure' || steps.build_modules.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: WindowsClangErrorReports
          path: |
                ${{ steps.build_headers.outputs.reports_paths }}
                ${{ steps.build_modules.outputs.reports_paths }}

      - name: Report failure
        if: ${{ steps.build_headers.outcome == 'failure' || steps.build_modules.outcome == 'failure' }}
        uses: actions/github-script@v9
        with:
          script: |
                  core.setFailed('Build failed and error reports uploaded')

      - name: Upload Artifact
        if: ${{ steps.build_headers.outcome == 'success' || steps.build_modules.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: WindowsClang
          path: ./examples/install/

  ubuntu-gcc:
    runs-on: ubuntu-latest

    steps:
      - name: deploy sources
        uses: actions/checkout@v6
        with:
          path: examples

      - name: extract builtin program versions
        id: versions
        run: |
             $ver = @()

             # g++
             (g++ --version)[0] -match "^g\+\+.* (?<version>[\d\.]+)$" *>$null
             $ver += "gcc_version=$($matches.version)"

             # cmake
             (cmake --version)[0] -match "cmake version (?<version>[\d\.]+)" *>$null
             $ver += "cmake_version=$($matches.version)"

             Add-Content -Path $Env:GITHUB_OUTPUT -Value $ver -Encoding OEM

      - name: use a gcc version C++20 module-able
        if: ${{ steps.versions.outputs.gcc_version < '15' }}
        uses: egor-tensin/setup-gcc@v2
        with:
          version: 15
          platform: x64
          cc: 1

      - name: use a cmake version able to build the std module
        if: ${{ steps.versions.outputs.cmake_version < '4.4.3' }}
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.4.3'

      - name: build/install examples from headers
        run: |
             cd examples
             mkdir -p build/headers
             mkdir -p install/headers
             cmake -DCMAKE_INSTALL_PREFIX="$pwd/install/headers" `
                   -DCMAKE_BUILD_TYPE=RelWithDebInfo `
                   -B ./build/headers .
             cmake --build ./build/headers -j --target install

      - name: build/install examples from modules
        run: |
             cd examples
             mkdir -p build/modules
             mkdir -p install/modules
             cmake -DCMAKE_INSTALL_PREFIX="$pwd/install/modules" `
                   -DCMAKE_BUILD_TYPE=RelWithDebInfo `
                   -DUSE_CXX_MODULES=ON `
                   -B ./build/modules -G Ninja .
             cmake --build ./build/modules -j --target install

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: UbuntuGCC
          path: ./examples/install/

  ubuntu-clang:
    runs-on: ubuntu-latest

    steps:
      - name: deploy sources
        uses: actions/checkout@v6
        with:
          path: examples

      - name: extract builtin program versions
        id: versions
        run: |
             $ver = @()

             # g++
             (g++ --version)[0] -match "^g\+\+.* (?<version>[\d\.]+)$" *>$null
             $ver += "gcc_version=$($matches.version)"

             # clang++
             (clang++ --version)[0] -match "^Ubuntu clang version (?<version>[\d\.]+) " *>$null
             $ver += "clang_version=$($matches.version)"

             # cmake
             (cmake --version)[0] -match "cmake version (?<version>[\d\.]+)" *>$null
             $ver += "cmake_version=$($matches.version)"

             Add-Content -Path $Env:GITHUB_OUTPUT -Value $ver -Encoding OEM

      - name: use a gcc version C++20 module-able
        if: ${{ steps.versions.outputs.gcc_version < '15' }}
        uses: egor-tensin/setup-gcc@v2
        with:
          version: 15
          platform: x64
          cc: 0

      - name: use a clang version C++20 module-able
        if: ${{ steps.versions.outputs.clang_version < '20' }}
        uses: egor-tensin/setup-clang@v2
        with:
          version: 20
          platform: x64
          cc: 1

      - name: use a cmake version able to build the std module
        if: ${{ steps.versions.outputs.cmake_version < '4.4.3' }}
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.4.3'

      - name: build/install examples from headers
        run: |
             cd examples
             mkdir -p build/headers
             mkdir -p install/headers
             cmake -DCMAKE_INSTALL_PREFIX="$pwd/install/headers" `
                   -DCMAKE_BUILD_TYPE=RelWithDebInfo `
                   -B ./build/headers .
             cmake --build ./build/headers -j --target install

      - name: build/install examples from modules
        run: |
             cd examples
             mkdir -p build/modules
             mkdir -p install/modules
             cmake -DCMAKE_INSTALL_PREFIX="$pwd/install/modules" `
                   -DCMAKE_BUILD_TYPE=RelWithDebInfo `
                   -DUSE_CXX_MODULES=ON `
                   -B ./build/modules -G Ninja .
             cmake --build ./build/modules -j --target install

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: UbuntuClang
          path: ./examples/install/

  macos-clang:
    runs-on: macos-latest

    steps:
      - name: deploy sources
        uses: actions/checkout@v6
        with:
          path: examples

      - name: build/install examples from headers
        run: |
             cd examples
             mkdir -p build/headers
             mkdir -p install/headers
             cmake -DCMAKE_INSTALL_PREFIX="$pwd/install/headers" `
                   -DCMAKE_BUILD_TYPE=RelWithDebInfo `
                   -B ./build/headers .
             cmake --build ./build/headers -j --target install

      - name: build/install examples from modules
        if: false # Apple Clang on macOS does not support C++20 modules yet, so we skip the module build step.
        run: |
             cd examples
             mkdir -p build/modules
             mkdir -p install/modules
             cmake -DCMAKE_INSTALL_PREFIX="$pwd/install/modules" `
                   -DCMAKE_BUILD_TYPE=RelWithDebInfo `
                   -DUSE_CXX_MODULES=ON `
                   -B ./build/modules -G Ninja .
             cmake --build ./build/modules -j --target install

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: MacOSClang
          path: ./examples/install/

